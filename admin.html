async function go(){const bt=document.querySelector(".lg button");if(bt){bt.disabled=true;bt.textContent="يرجى الانتظار..."}const u=$("#lm").value.trim();localStorage.setItem("adm_u",u);try{const r=await fetch(API,{method:"POST",headers:{"Content-Type":"text/plain"},body:JSON.stringify({action:"login",user:u,pass:$("#lk").value})}),j=await r.json();if(j.error)throw new Error(j.error);TK=j.token;sessionStorage.setItem("adm_t",TK);await load()}catch(e){login(e.message)}}
function logout(){sessionStorage.removeItem("adm_t");TK="";S=null;login()}
function fix(n){const c=n.cfg=n.cfg||{};c.home=c.home||Object.keys(HBL).map(id=>({id,on:1}));c.nav=c.nav||NAV0.map(([i,t,h])=>({i,t,h,on:1}));c.ads=c.ads||[];c.colors={pri:"#9a6208",acc:"#e8ad1c",grn:"#3f7d2c",bg:"#fcf8e6",...(c.colors||{})};c.editorial=c.editorial||[];c.poll=c.poll||{q:"",o:[]};c.pages=c.pages||{};[["about","من نحن"],["privacy","سياسة الخصوصية"],["ads","أعلن معنا"]].forEach(([k,x])=>c.pages[k]=c.pages[k]||[x,""]);["arts","subs","coms","users","log"].forEach(k=>n[k]=n[k]||[]);n.stats=n.stats||{}}
async function load(){if(!TK||!API)return login();try{const n=await api("getAll");fix(n);S=n;VER=n.v;render()}catch(e){if(TK)login(e.message)}}
const cnt=n=>({c:n.coms.filter(x=>x.r[6]==="جديد").length,s:n.subs.filter(x=>x.r[6]==="جديد").length});
setInterval(async()=>{if(document.hidden||!TK||!S||ED||UE)return;const a=document.activeElement;if(a&&(/INPUT|TEXTAREA|SELECT/.test(a.tagName)||a.isContentEditable))return;if(!["arts","cmts","inbox","dash","log"].includes(TAB))return;
 try{const j=await api("ver");if(j.v===VER)return;const n=await api("getAll");fix(n);VER=n.v;const o=cnt(S),m=cnt(n);S=n;if(m.c>o.c)msg("وصل تعليق جديد");if(m.s>o.s)msg("وصلت مشاركة جديدة");render()}catch(e){}},30000);
load();
