async function sync(){
 if(!API_URL){DATA=SAMPLE;LOADED=1;return paint("لم يُضبط رابط الشيت بعد، تُعرض بيانات تجريبية.")}

 catch(e){if(!LOADED){DATA=SAMPLE;LOADED=1;paint("تعذر الاتصال بالشيت، تُعرض بيانات تجريبية.")}else setOff(true)}}

pi();uInit();{const c=ls("cache");if(c&&c.length){DATA=c;LOADED=1}}applyCfg(ls("cfg")||{});sync();rxAll();nInit();offUI();if(OFF)setTimeout(()=>tst("لا يوجد اتصال، يتم عرض آخر محتوى محفوظ",4500),700);
