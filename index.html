<style>
:root{--bg:#fcf8e6;--card:#fffdf4;--ink:#2a2410;--head:#5a3a08;--mut:#7a6f4c;--pri:#9a6208;--acc:#e8ad1c;--grn:#3f7d2c;--gbg:#3f7d2c;--line:#ecdfae;--fs:18px}
html.dark{--bg:#17190c;--card:#23260f;--ink:#f6efd6;--head:#f2d46a;--mut:#bdb99a;--pri:#8a5f0a;--grn:#9bd06f;--gbg:#2f5c20;--line:#3d4220}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.7 Cairo,Tahoma,sans-serif;padding-top:env(safe-area-inset-top,0px)}
a{color:inherit;text-decoration:none}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
h1,h2,h3{font-family:"Noto Naskh Arabic",Cairo,serif;line-height:1.45;margin:0;color:var(--head)}.hero h1{color:#fff}
.wrap{max-width:1000px;margin:0 auto;padding:0 16px}
.ticker{background:var(--gbg);color:#fff;border-bottom:3px solid var(--acc);font-size:14px;padding:6px 16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header .wrap{padding-top:12px;padding-bottom:12px}
header img{display:block;width:100%;height:auto;border-radius:14px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
nav{background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
nav .wrap{display:flex;gap:4px;overflow-x:auto;padding-top:6px;padding-bottom:6px}
nav a,nav button{white-space:nowrap;padding:6px 14px;border-radius:999px;color:var(--mut);background:none;border:0;font:inherit;cursor:pointer}
nav a.on{background:var(--pri);color:#fff}
nav .sp{color:var(--grn);font-weight:600}
main{padding:22px 0 40px;min-height:60vh}
.lead{display:grid;grid-template-columns:2fr 1fr;gap:16px}
.hero{background:var(--pri) center/cover;color:#fff;border-radius:14px;padding:26px;display:flex;flex-direction:column;justify-content:flex-end;min-height:300px;position:relative;overflow:hidden}
.hero::before{content:"";position:absolute;inset:0;background:linear-gradient(transparent 20%,rgba(48,36,4,.92))}
.hero>*{position:relative}
.tag{color:var(--grn);font-size:13px;font-weight:600}.hero .tag{color:var(--acc)}
.hero h1{font-size:clamp(24px,4vw,36px);margin:8px 0}
.side{display:flex;flex-direction:column;gap:12px}
.item{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;display:block}
.item:hover{border-color:var(--grn)}
.item h3{font-size:18px}.item small{color:var(--mut)}
.item img{width:100%;height:150px;object-fit:cover;border-radius:6px;margin-bottom:8px}
h2.h{font-size:24px;margin:32px 0 12px;padding-right:12px;border-right:5px solid var(--acc)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
.art{max-width:700px;margin:0 auto}
.art h1{font-size:clamp(26px,4vw,38px)}.meta{color:var(--mut);margin:8px 0 14px}
.art img{width:100%;border-radius:10px;margin-bottom:16px}
.art p{font-size:var(--fs);line-height:2}
.btn{display:inline-block;background:var(--acc);color:#2a1a05;border-radius:8px;padding:8px 16px;font-weight:600;margin:4px 0 4px 6px;border:0;font:inherit;font-weight:600;cursor:pointer}
.btn.g{background:var(--gbg);color:#fff}.btn.o{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.bar{display:flex;flex-wrap:wrap;margin:10px 0 18px}
.note{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px 14px;color:var(--mut);font-size:14px;margin-bottom:16px}
.inp{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:inherit;margin:6px 0 14px}
.chips{display:flex;flex-wrap:wrap;gap:8px}.chip{padding:6px 14px;border-radius:999px;background:var(--card);border:1px solid var(--line)}.chip:hover{border-color:var(--grn)}
label{display:block;font-weight:600;margin-top:6px}
footer{border-top:4px solid var(--grn);padding:22px 0 40px;color:var(--mut);font-size:14px;text-align:center}
footer a{margin:0 8px;color:var(--grn)}
.ad{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:10px;margin:24px 0;font-size:14px}.ad img{width:100%;border-radius:8px;display:block}.ad video,.ad iframe{width:100%;aspect-ratio:16/9;border:0;border-radius:8px;display:block;background:#000}
.adt{display:flex;justify-content:space-between;align-items:center;color:var(--mut);font-size:12px;margin-bottom:6px}.adl{padding:10px 4px;font-size:16px}
.prefs{background:var(--card);border-bottom:1px solid var(--line)}.prefs .wrap{display:flex;justify-content:space-between;align-items:center;padding-top:3px;padding-bottom:3px}
.ib{background:none;border:0;color:var(--mut);padding:7px;border-radius:50%;display:inline-grid;place-items:center;cursor:pointer;line-height:0}.ib:hover{color:var(--pri);background:var(--line)}.ib[hidden]{display:none}
svg.i{width:1.2em;height:1.2em;vertical-align:-.25em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
nav a{display:inline-flex;align-items:center;gap:6px}h2.h svg.i{color:var(--acc)}
.bar2{display:flex;gap:8px;flex-wrap:wrap}.bar2 .inp{flex:1;min-width:140px;margin:0 0 12px}.poll .btn{display:block;width:100%;text-align:right}
@media(max-width:720px){.lead{grid-template-columns:1fr}.hero{min-height:230px}}
@media print{header,nav,footer,.ticker,.bar{display:none}}
</style>
</head>

 return`<article class="art"><span class="tag">${esc(a.section)}</span><h1>${esc(a.title)}</h1>${a.subtitle?`<h3>${esc(a.subtitle)}</h3>`:""}<div class="meta">${a.author?esc(a.author)+" • ":""}${fmt(a.date)} • ${mins} دقائق قراءة</div>
<div class="bar"><button class="btn o" onclick="fs(2)">أ+</button><button class="btn o" onclick="fs(-2)">أ-</button><button class="btn o" onclick="bk('${esc(a.id)}')">${sv?"إزالة من المحفوظات":"حفظ"}</button><button class="btn o" onclick="print()">طباعة</button></div>
${img(a.img)?`<img src="${img(a.img)}" alt="${esc(a.title)}">`:""}${ps.map(p=>`<p>${esc(p)}</p>`).join("")}

${adSlot("article")}${flag(CFG.comments)?`<h2 class="h">التعليقات</h2><div id="cl"></div><form onsubmit="cm(event,'${esc(a.id)}')"><input class="inp" id="cn" required placeholder="الاسم"><textarea class="inp" id="ct" rows="3" required placeholder="اكتب تعليقك"></textarea><button class="btn g">إرسال التعليق</button></form><div id="cr"></div>`:""}${rel.length?`<h2 class="h">اقرأ أيضاً</h2>${grid(rel)}`:""}</article>`},

 let b="";

 else if(k==="image"&&img(m))b=(l?`<a href="${l}" target="_blank" rel="noopener sponsored" onclick="post({type:'نقرة إعلان',ref:'${id}'})">`:"")+`<img src="${img(m)}" alt="${esc(a.title||"إعلان")}" loading="lazy">`+(l?"</a>":"");

 const ref="SR-"+Date.now().toString(36).toUpperCase(),p={ref,type:$("#st").value,name:$("#sn").value,contact:$("#sc").value,text:$("#sx").value,date:new Date().toISOString()};

{const d=ls("dk");if(d===null?matchMedia("(prefers-color-scheme:dark)").matches:d)document.documentElement.classList.add("dark");const f=ls("fs");if(f)document.documentElement.style.setProperty("--fs",f+"px")}
